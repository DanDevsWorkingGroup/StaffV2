name: CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

# Deployment is handled by Cloudflare Workers Builds, which builds and deploys
# straight from this repository. This workflow only verifies the code.
jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test the D1 query layer
        run: npm test

      - name: Build
        run: npm run build
