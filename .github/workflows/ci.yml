name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
  workflow_dispatch:

# Deployment is handled by Cloudflare Workers Builds: one Worker per branch,
# each with its own D1. This workflow only verifies the code.
jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test the D1 query layer
        run: npm test

      # Build the environment this branch actually deploys to, so a config
      # mistake in wrangler.jsonc fails here rather than in Workers Builds.
      - name: Build
        run: |
          case "${GITHUB_REF_NAME}" in
            staging) npm run build:staging ;;
            dev)     npm run build:dev ;;
            *)       npm run build ;;
          esac

      - name: Confirm the build targeted the right Worker and database
        run: |
          node -e "
            const c = require('./dist/server/wrangler.json');
            const branch = process.env.GITHUB_REF_NAME;
            const expected = branch === 'staging' ? 'abpm-trainer-staging'
                           : branch === 'dev'     ? 'abpm-trainer-dev'
                           : 'abpm-trainer';
            const db = c.d1_databases[0].database_name;
            console.log('branch=' + branch + ' worker=' + c.name + ' d1=' + db);
            if (c.name !== expected || db !== expected) {
              console.error('Expected worker and database ' + expected);
              process.exit(1);
            }
          "
