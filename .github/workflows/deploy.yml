name: Deploy to Cloudflare Workers

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test the D1 query layer
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping deploy. Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable it."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.creds.outputs.present == 'true'
        run: npm install

      # wrangler deploys the built output, so the build must run first.
      - name: Build
        if: steps.creds.outputs.present == 'true'
        run: npm run build

      - name: Deploy
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
